name: claude_hooks_build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "configs/claude/hooks/**.cs"
      - ".github/workflows/claude-hooks-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # フックは file-based app (単一 .cs) であり Nix はこれを配布するだけ。
      # buildable 確認はコンパイルが通るかであり、各 .cs を dotnet build する。
      - name: Build file-based hook apps
        run: |
          for f in configs/claude/hooks/*.cs; do
            echo "::group::build $f"
            dotnet build "$f"
            echo "::endgroup::"
          done
