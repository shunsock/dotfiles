name: nvimc_docker_build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'nvimc/**'
      - '.github/workflows/nvimc-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: nvimc-default-arm
            dockerfile: nvimc/nvimc-default-arm/Dockerfile
            context: nvimc/nvimc-default-arm
            platform: linux/arm64

          - name: nvimc-default-amd
            dockerfile: nvimc/nvimc-default-amd/Dockerfile
            context: nvimc/nvimc-default-amd
            platform: linux/amd64

          - name: nvimc-python
            dockerfile: nvimc/nvimc-python/Dockerfile
            context: nvimc/nvimc-python
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ matrix.name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
